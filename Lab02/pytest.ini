[pytest]
# Sem "testpaths": cada kata é testada isoladamente, uma de cada vez, para
# evitar que o módulo "solution" de uma kata seja confundido com o de outra
# quando várias fossem coletadas no mesmo processo. Use scripts/run_tests.py
# ou aponte o pytest direto para a pasta de uma kata, ex.:
#   pytest katas/K01/tests
addopts = -q --tb=short
python_files = test_*.py
python_functions = test_*
