# Snapshot do GitHub Projects (v2).
# Fica em subpasta de proposito: o coletor C# concatena apenas os .graphql
# soltos em queries/, entao este arquivo nao entra na consulta dos repositorios.
# Exige token com escopo read:project (o token da coleta nao serve).

query ProjectSnapshot($owner: String!, $number: Int!, $cursor: String) {
  repositoryOwner(login: $owner) {
    ... on User {
      projectV2(number: $number) {
        ...Board
      }
    }
    ... on Organization {
      projectV2(number: $number) {
        ...Board
      }
    }
  }
}

fragment Board on ProjectV2 {
  title
  url
  items(first: 50, after: $cursor) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      id
      type
      createdAt
      updatedAt
      fieldValues(first: 20) {
        nodes {
          ... on ProjectV2ItemFieldSingleSelectValue {
            name
            field {
              ... on ProjectV2FieldCommon {
                name
              }
            }
          }
          ... on ProjectV2ItemFieldIterationValue {
            title
            field {
              ... on ProjectV2FieldCommon {
                name
              }
            }
          }
          ... on ProjectV2ItemFieldTextValue {
            text
            field {
              ... on ProjectV2FieldCommon {
                name
              }
            }
          }
          ... on ProjectV2ItemFieldDateValue {
            date
            field {
              ... on ProjectV2FieldCommon {
                name
              }
            }
          }
          ... on ProjectV2ItemFieldNumberValue {
            number
            field {
              ... on ProjectV2FieldCommon {
                name
              }
            }
          }
        }
      }
      content {
        ... on Issue {
          number
          title
          url
          state
          createdAt
          closedAt
          repository {
            nameWithOwner
          }
          assignees(first: 10) {
            nodes {
              login
            }
          }
          labels(first: 10) {
            nodes {
              name
            }
          }
        }
        ... on PullRequest {
          number
          title
          url
          state
          createdAt
          closedAt
          repository {
            nameWithOwner
          }
          assignees(first: 10) {
            nodes {
              login
            }
          }
          labels(first: 10) {
            nodes {
              name
            }
          }
        }
        ... on DraftIssue {
          title
        }
      }
    }
  }
}
