# RQ03 releases | RQ04 frequencia de atualizacao
# updatedAt muda com qualquer metadado (ate uma estrela nova). A analise usa pushedAt.
# A API nao entrega o primeiro commit: history(last:1) e recusado por exigir cursor
# "before". O inicio do periodo de desenvolvimento usa createdAt como aproximacao.
# releases.totalCount e truncado em 1000 pela API: valores no teto sao minimos, nao exatos.
fragment RepoReleasesAndActivity on Repository {
  releases {
    totalCount
  }
  updatedAt
  pushedAt
  defaultBranchRef {
    name
    target {
      ... on Commit {
        lastCommit: history(first: 1) {
          totalCount
          nodes {
            committedDate
          }
        }
      }
    }
  }
}
