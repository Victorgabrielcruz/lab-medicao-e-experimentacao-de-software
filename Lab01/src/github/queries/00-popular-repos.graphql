query PopularRepos($searchQuery: String!, $pageSize: Int!, $cursor: String) {
  rateLimit {
    cost
    remaining
    limit
    resetAt
  }
  search(
    query: $searchQuery
    type: REPOSITORY
    first: $pageSize
    after: $cursor
  ) {
    repositoryCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...RepoIdentity
      ...RepoAgeAndPullRequests
      ...RepoReleasesAndActivity
      ...RepoLanguageAndIssues
    }
  }
}
