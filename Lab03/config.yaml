# Configuração do pipeline do Lab03 — Mineração de métricas DORA.
# O token do GitHub NUNCA deve ser colocado aqui: use a variável de ambiente GITHUB_TOKEN.

api:
  base_url: https://api.github.com
  per_page: 100
  timeout_s: 30

# Janela de observação de 12 meses (datas inclusivas, UTC).
# Ver docs/definicoes-operacionais.md.
janela:
  inicio: 2025-10-01
  fim: 2026-09-30

# Critério mínimo de inclusão, contado dentro da janela.
inclusao:
  min_releases: 5
  min_runs_validos: 50
  incluir_prereleases: false  # definição principal: releases estáveis (#138)

# Workflow runs considerados no cálculo.
runs:
  evento: push
  somente_default_branch: true
  conclusoes_sucesso: [success]
  conclusoes_falha: [failure, timed_out, startup_failure]

# Seleção de candidatos pela Search API. O qualificador pushed:>=<janela.inicio>
# é acrescentado automaticamente. A faixa de estrelas é dividida até cada
# consulta ter no máximo 1000 resultados.
busca:
  estrelas_min: 1000
  estrelas_max: 1000000
  qualificadores: ["fork:false", "archived:false", "is:public"]
  linguagens: []      # vazio = sem filtro de linguagem
  intervalo_s: 2.1    # Search API autenticada: 30 requisições por minuto

caminhos:
  cache: data/cache
  raw: data/raw
  processed: data/processed
