# RQ05 linguagem primaria | RQ06 percentual de issues fechadas
# primaryLanguage vem null em repos de documentacao e listas curadas.
fragment RepoLanguageAndIssues on Repository {
  primaryLanguage {
    name
  }
  openIssues: issues(states: OPEN) {
    totalCount
  }
  closedIssues: issues(states: CLOSED) {
    totalCount
  }
}
